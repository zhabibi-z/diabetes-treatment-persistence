[project]
name            = "t2dm-persistence-rwe"
version         = "2.0.0"
description     = "Comparative treatment persistence in T2DM — RWE pipeline, inference API, and dashboard"
requires-python = ">=3.11"
license         = { text = "MIT" }

[tool.pytest.ini_options]
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions= ["test_*"]
addopts         = "-v --tb=short"
filterwarnings  = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select  = ["E", "W", "F", "I"]
# W503 (line break before binary operator) is a pycodestyle rule ruff does not
# implement; leaving it here made `ruff check` fail with "unknown rule selector".
ignore  = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "api", "ml"]
